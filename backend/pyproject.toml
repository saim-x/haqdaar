[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "haqdaar-backend"
version = "0.1.0"
description = "Haqdaar — multi-tenant AI-assisted public benefit delivery, consent, audit & anti-scam platform (prototype)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "alembic==1.20.1",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "python-multipart==0.0.34",
    "rapidfuzz==3.14.6",
    "openai==3.57.0",
    "opencv-python-headless==5.1.0.95",
    "pillow==13.0.0",
    "qrcode==8.2",
    "scikit-learn==1.9.1",
    "numpy<2.3",
    "edge-tts==7.3.1",
    "email-validator==2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S", "ISC", "BLE"]
ignore = ["B008", "ISC004"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"backend/app/mocks/**" = ["BLE001", "S110", "S112"]
"backend/app/ai/**" = ["BLE001", "S110", "S112"]
"backend/app/jobs/**" = ["BLE001", "S110", "S112"]
"backend/app/agent/**" = ["BLE001", "S110", "S112"]
"backend/tests/**" = ["S101", "BLE001", "S110", "S112"]
"app/mocks/**" = ["BLE001", "S110", "S112", "S101", "S105", "S106", "S311"]
"app/ai/**" = ["BLE001", "S110", "S112", "S105", "B905"]
"app/jobs/**" = ["BLE001", "S110", "S112"]
"app/agent/**" = ["BLE001", "S110", "S112", "S101"]
"app/engine/**" = ["S105"]
"app/api/v1/scam.py" = ["BLE001", "S110", "B904"]
"app/api/v1/rag.py" = ["BLE001", "B904"]
"app/api/v1/voice.py" = ["BLE001", "B904"]
"app/api/v1/admin_mocks.py" = ["BLE001", "B904"]
"tests/**" = ["S101", "BLE001", "S110", "S112", "E402", "S603", "B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: touches the database / full app stack",
    "security: security, RBAC, consent and audit assertions",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

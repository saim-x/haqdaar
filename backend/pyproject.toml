[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "haqdaar-backend"
version = "0.1.0"
description = "Haqdaar — multi-tenant AI-assisted public benefit delivery, consent, audit & anti-scam platform (prototype)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.9",
    "psycopg[binary]==3.3.9",
    "alembic==1.20.1",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
    "argon2-cffi==25.1.0",
    "pyjwt==2.15.1",
    "python-multipart==0.0.34",
    "rapidfuzz==3.14.6",
    "openai==3.57.0",
    "opencv-python-headless==5.1.0.95",
    "pillow==13.0.0",
    "qrcode==8.2",
    "scikit-learn==1.9.1",
    "numpy==2.5.5",
    "edge-tts==7.3.1",
    "email-validator==2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the documented pattern
    "RUF001", # ambiguous unicode in Urdu strings is intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: touches the database / full app stack",
    "security: security, RBAC, consent and audit assertions",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
